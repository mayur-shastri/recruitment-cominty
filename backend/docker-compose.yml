# Recruitment backend (Slack <-> Cominty bridge).
# Joins the EXISTING shared proxy network - never another Caddy.
# Shared proxy network (verified via VPS inspection; see docs/vps-deploy.md).
# Requires ../.env at the repo root on the VPS (gitignored, created once).
services:
  recruitment-backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: recruitment-backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ../.env
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: harly_default
