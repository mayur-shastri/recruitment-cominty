[project]
name = "acmetech-recruitment-backend"
version = "0.1.0"
description = "AcmeTech recruitment backend: Slack/FastAPI bridge to Cominty managed agents."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp==2.3.0",
    "slack-sdk>=3.27",
    "aiohttp>=3.9",
    "cominty-sdk>=1.0",
    "boto3>=1.34",
    "acmetech-recruitment-db",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.19",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
