# AcmeTech scores MCP server.
# NOTE: this service is intentionally NOT pip-installed (flat layout:
# server.py runs from source). Install its runtime deps explicitly:
#     pip install -r db-mcp/requirements.txt
# Plus the shared models, from the repo root:
#     pip install -e ./db
# Floors verified against the installed SDK (mcp 2.3.0; v1 API differs).
[project]
name = "acmetech-db-mcp"
version = "0.1.0"
description = "AcmeTech scores MCP server: assessment storage for Cominty agents."
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
