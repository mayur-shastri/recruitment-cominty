# Scores MCP server (assessment storage for Cominty agents).
# Joins the EXISTING shared proxy network - never another Caddy.
# Shared proxy network (verified via VPS inspection; see docs/vps-deploy.md).
services:
  recruitment-dbmcp:
    build:
      context: ..
      dockerfile: db-mcp/Dockerfile
    container_name: recruitment-dbmcp
    restart: unless-stopped
    expose:
      - "8003"
    environment:
      DB_MCP_HOST: "0.0.0.0" # 127.0.0.1 would be unreachable from Caddy
      DB_MCP_PORT: "8003"
      LOG_LEVEL: INFO
    env_file:
      - ../.env
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: harly_default
