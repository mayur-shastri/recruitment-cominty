# Recruitment MCP server (AcmeTech ATS tools for Cominty agents).
# Joins the EXISTING shared proxy network - never another Caddy.
# Shared proxy network (verified via VPS inspection; see docs/vps-deploy.md).
services:
  recruitment-mcp:
    build: .
    container_name: recruitment-mcp
    restart: unless-stopped
    expose:
      - "8002"
    environment:
      MCP_HOST: "0.0.0.0" # 127.0.0.1 would be unreachable from Caddy
      MCP_PORT: "8002"
      LOG_LEVEL: INFO
    env_file:
      - ../.env
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: harly_default
