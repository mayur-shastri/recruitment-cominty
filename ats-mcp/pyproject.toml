# AcmeTech ATS MCP server.
# NOTE: this service is intentionally NOT pip-installed (flat §14 layout:
# server.py runs from source). Install its runtime deps explicitly:
#     pip install "mcp>=1.0" httpx pydantic-settings
# Floors verified against the installed SDK (mcp 2.3.0; v1 API differs).
[project]
name = "acmetech-ats-mcp"
version = "0.1.0"
description = "AcmeTech ATS MCP server: recruitment tools for Cominty agents."
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
