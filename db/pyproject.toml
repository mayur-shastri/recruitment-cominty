[project]
name = "acmetech-recruitment-db"
version = "0.1.0"
description = "AcmeTech recruitment shared Postgres layer: models, engine factory, URL helper."
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["recruitment_db*"]
