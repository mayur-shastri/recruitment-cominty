# Backend CI: runs iff backend/**, db/** (or this file) changes.
name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", "db/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "db/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e ./db -e './backend[dev]'
      - name: Run tests
        run: pytest backend/tests -q
